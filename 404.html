<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://font.sec.miui.com/font/css?family=MiSans:400,700:MiSans" />
    <link rel="stylesheet" href="https://hz.danevan.top/github-markdown.css">
    <link rel="stylesheet" href="https://hz.danevan.top/style.css">
    <link rel="stylesheet" href="https://hz.danevan.top/doc.css">
    <link rel="icon" href="https://hz.danevan.top/favicon.ico" type="image/x-icon" />
    <script defer src="https://events.vercount.one/js"></script>
    <title>404 - 页面未找到 - 菏泽初中信息技术考试练习系统安装教程 - Dan_Evan's Website</title>
    <style>
        .error-404 {
            text-align: center;
            padding: 40px 0 20px;
        }

        .error-404 .code {
            font-size: 6em;
            font-weight: bold;
            line-height: 1;
            margin: 0;
            color: #007bff;
        }

        .error-404 .msg {
            font-size: 1.4em;
            font-weight: bold;
            margin: 12px 0 16px;
        }

        .error-404 .nav {
            margin-top: 24px;
        }

        .error-404 .nav a {
            margin: 0 6px;
        }

        @media (prefers-color-scheme: dark) {
            .error-404 .code {
                color: #4493f8;
            }
        }
    </style>
</head>

<body>
    <!-- 标题栏 -->
    <div class="header" id="header">
        <b><a href="https://www.danevan.top/" target="_blank">DE's Website</a></b>
        <div class="header-right">
            <a href="https://hz.danevan.top/index.html">首页</a>
            <a href="#sidebar">展开目录</a>
        </div>
    </div>
    <!-- 添加菜单栏 -->
    <div class="sidebar" id="sidebar"></div>
    <script src="https://hz.danevan.top/hs.js"></script>
    <!-- 将 404 页面侧边栏链接改为本站绝对路径 -->
    <script>
        (function () {
            var sidebar = document.getElementById('sidebar');
            if (!sidebar) return;
            Array.prototype.forEach.call(sidebar.querySelectorAll('a[href]'), function (a) {
                var h = a.getAttribute('href');
                if (h && !/^https?:\/\//.test(h) && h.charAt(0) !== '#' && h.indexOf('javascript:') !== 0) {
                    a.setAttribute('href', 'https://hz.danevan.top/' + h);
                }
            });
        })();
    </script>
    <!-- 内容 -->
    <div class="container">
        <div class="markdown-body">
            <div class="error-404">
                <p class="code">404</p>
                <p class="msg">哎呀，这个页面好像走丢了……</p>
                <p>你要找的页面可能不存在、已被移动，或者链接有误。<br />（本站近期调整过目录结构，旧链接可能已失效）</p>
                <div class="nav">
                    <a href="https://hz.danevan.top/index.html" class="button-in-text"><b>返回首页</b></a>
                    <a href="https://hz.danevan.top/index.html#content" class="button-in-text"><b>查看目录</b></a>
                    <a href="https://hz.danevan.top/history.html" class="button-in-text"><b>更新历史</b></a>
                </div>
            </div>
            <hr />
            <footer>
                <p>Copyright &copy 2025~2026 Dan_Evan. All rights reserved.</p>
            </footer>
        </div>
    </div>
</body>

</html>
